<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plushify - Generate Your Custom Plushie Avatar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader {
            border-top-color: #3B82F6;
            animation: spinner 1.5s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col items-center p-4 sm:p-8">

    <div class="max-w-4xl w-full bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 p-6 sm:p-10 my-auto">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-purple-400 to-indigo-400">
                ✨ Plushify Avatar Generator
            </h1>
            <p class="text-slate-400 mt-2 text-sm sm:text-base">
                Upload a photo or configure your options to turn anyone into a squishy plushie avatar.
            </p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Form Controls -->
            <form id="plushieForm" class="space-y-5">
                <!-- Image Upload -->
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">1. Reference Photo (Optional)</label>
                    <input type="file" id="imageInput" accept="image/*" class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer bg-slate-900 rounded-lg border border-slate-700 p-1">
                </div>

                <!-- Expanded Skin Tone / Fabric Dye -->
                <div>
                    <label for="skinTone" class="block text-sm font-semibold text-slate-300 mb-2">2. Skin Tone / Fabric Dye</label>
                    <select id="skinTone" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="fair pale Caucasian">Fair / Light (Pale)</option>
                        <option value="medium Caucasian light beige">Light / Beige</option>
                        <option value="warm tan olive">Olive / Warm Tan</option>
                        <option value="medium brown caramel" selected>Caramel / Medium Brown</option>
                        <option value="deep rich brown">Deep Brown</option>
                        <option value="dark black espresso">Dark / Espresso (Black)</option>
                    </select>
                </div>

                <!-- Material Type -->
                <div>
                    <label for="material" class="block text-sm font-semibold text-slate-300 mb-2">3. Plushie Material</label>
                    <select id="material" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="ultra-soft fleece" selected>Ultra-Soft Fleece</option>
                        <option value="fluffy faux fur">Fluffy Faux Fur</option>
                        <option value="velvet felt fabric">Velvet / Felt Fabric</option>
                        <option value="knit yarn wool">Knit Yarn / Wool</option>
                    </select>
                </div>

                <!-- Features Checkboxes -->
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">4. Key Features</label>
                    <div class="grid grid-cols-2 gap-2 text-sm text-slate-300 bg-slate-900 p-3 rounded-lg border border-slate-700">
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" name="features" value="glasses" class="rounded bg-slate-800 border-slate-600 text-indigo-500 focus:ring-indigo-500">
                            <span>Glasses</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" name="features" value="beard and mustache" class="rounded bg-slate-800 border-slate-600 text-indigo-500 focus:ring-indigo-500">
                            <span>Beard / Facial Hair</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" name="features" value="curly hair" class="rounded bg-slate-800 border-slate-600 text-indigo-500 focus:ring-indigo-500">
                            <span>Curly Hair</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" name="features" value="beanie hat" class="rounded bg-slate-800 border-slate-600 text-indigo-500 focus:ring-indigo-500">
                            <span>Beanie Hat</span>
                        </label>
                    </div>
                </div>

                <!-- Background Scene -->
                <div>
                    <label for="scene" class="block text-sm font-semibold text-slate-300 mb-2">5. Setting / Background</label>
                    <select id="scene" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="minimalist studio" selected>Minimalist Studio</option>
                        <option value="cozy bedroom shelf">Cozy Bedroom Shelf</option>
                        <option value="soft pastel studio background">Soft Pastel Backdrop</option>
                        <option value="wooden desk setup">Wooden Desk Setup</option>
                    </select>
                </div>

                <!-- Custom Notes -->
                <div>
                    <label for="customNotes" class="block text-sm font-semibold text-slate-300 mb-2">6. Custom Styling Details (Optional)</label>
                    <textarea id="customNotes" rows="2" placeholder="e.g. wearing a blue hoodie, green eyes, holding a coffee cup..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none placeholder-slate-500"></textarea>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="generateBtn" class="w-full py-3.5 px-4 bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-600 hover:from-pink-600 hover:via-purple-600 hover:to-indigo-700 text-white font-bold rounded-xl shadow-lg transition transform active:scale-98 flex justify-center items-center gap-2">
                    <span>✨ Generate Plushie Avatar</span>
                </button>
            </form>

            <!-- Preview Output Area -->
            <div class="flex flex-col items-center justify-center bg-slate-900 rounded-xl border border-slate-700 p-6 relative min-h-[350px]">
                <!-- Placeholder / Loading State -->
                <div id="loadingState" class="hidden flex-col items-center space-y-3 text-center">
                    <div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-700 h-12 w-12"></div>
                    <p class="text-sm font-medium text-slate-300">Crafting your custom plushie render...</p>
                    <p class="text-xs text-slate-500">Powered by Flux Dev (takes ~10–12s)</p>
                </div>

                <div id="placeholderState" class="text-center text-slate-500">
                    <svg class="mx-auto h-16 w-16 mb-3 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                    </svg>
                    <p class="text-sm">Your generated plushie avatar will appear here</p>
                </div>

                <!-- Result Image -->
                <img id="resultImage" src="" alt="Plushie Avatar" class="hidden w-full h-auto max-h-[450px] object-contain rounded-lg shadow-md border border-slate-700">
            </div>
        </div>
    </div>

    <!-- Script to handle payload & form submission -->
    <script>
        document.getElementById('plushieForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const generateBtn = document.getElementById('generateBtn');
            const loadingState = document.getElementById('loadingState');
            const placeholderState = document.getElementById('placeholderState');
            const resultImage = document.getElementById('resultImage');

            // Gather inputs
            const skinTone = document.getElementById('skinTone').value;
            const material = document.getElementById('material').value;
            const scene = document.getElementById('scene').value;
            const customNotes = document.getElementById('customNotes').value;

            // Gather feature checkboxes
            const selectedFeatures = [];
            document.querySelectorAll('input[name="features"]:checked').forEach(cb => {
                selectedFeatures.push(cb.value);
            });

            // Convert photo to base64 if selected
            const imageInput = document.getElementById('imageInput');
            let imageBase64 = null;
            if (imageInput.files && imageInput.files[0]) {
                const file = imageInput.files[0];
                imageBase64 = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.readAsDataURL(file);
                });
            }

            // UI loading transition
            generateBtn.disabled = true;
            generateBtn.classList.add('opacity-50', 'cursor-not-allowed');
            placeholderState.classList.add('hidden');
            resultImage.classList.add('hidden');
            loadingState.classList.remove('hidden');
            loadingState.classList.add('flex');

            try {
                const response = await fetch('/api/generate-plushie', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        imageBase64: imageBase64,
                        skinTone: skinTone,
                        features: selectedFeatures,
                        material: material,
                        scene: scene,
                        customNotes: customNotes
                    })
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.error || 'Failed to generate plushie avatar.');
                }

                // Show result image
                resultImage.src = data.imageUrl;
                resultImage.classList.remove('hidden');

            } catch (err) {
                alert(`Generation Error: ${err.message}`);
                placeholderState.classList.remove('hidden');
            } finally {
                loadingState.classList.add('hidden');
                loadingState.classList.remove('flex');
                generateBtn.disabled = false;
                generateBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        });
    </script>
</body>
</html>
